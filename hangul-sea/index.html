<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽실이의 한글 바다</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 위쪽 헤더 + 가운데 큰 놀이 무대(바다 그림 대신 CSS 장면) + 아래 안내/버튼 줄.
   한 가지 밝은 바다 세계로 고정한 디자인(다크 모드 없음). */
:root {
  color-scheme: light;
  --sea: #3a9cc4;
  --sea-deep: #1b5f86;
  --foam: #e9f7fb;
  --sand: #f6e2b0;
  --sand-deep: #c99a4e;
  --coral: #ff7a59;
  --kelp: #2f8a5b;
  --sun: #ffd166;
  --ink: #1f3448;
  --ink-soft: #4b6175;
  --paper: #fffaf0;
  --shadow: rgba(27, 95, 134, 0.22);
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 26px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--foam);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 4px solid var(--coral); outline-offset: 3px;
}
[hidden] { display: none !important; }

#app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* 헤더 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.top h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(1.5rem, 4.2vw, 2.6rem); color: var(--sea-deep);
  text-align: center; text-wrap: balance; letter-spacing: 0.02em;
}
.top h1 small { display: block; font-family: var(--font-body); font-size: 0.42em; color: var(--ink-soft); letter-spacing: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-display); font-size: 1.05rem;
  background: var(--paper); border: 3px solid var(--sand-deep); border-radius: 999px;
  padding: 8px 16px; box-shadow: 0 4px 0 var(--sand-deep);
  white-space: nowrap;
}
.pill:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sand-deep); }

/* 무대 */
.stage {
  position: relative; overflow: hidden;
  height: clamp(440px, 66vh, 640px);
  border-radius: var(--radius);
  border: 6px solid var(--sand-deep);
  background: var(--sea);
  box-shadow: 0 10px 30px var(--shadow);
}
.stage.tall { height: auto; min-height: clamp(440px, 66vh, 640px); overflow: visible; }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hint { margin: 0; font-family: var(--font-display); font-size: 1.15rem; text-align: center; color: var(--ink); text-wrap: balance; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

/* 공통 장면 요소 */
.scene { position: absolute; inset: 0; }
.waves {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60px 10px at 20% 30%, rgba(255,255,255,.35), transparent 70%),
    radial-gradient(ellipse 80px 12px at 70% 18%, rgba(255,255,255,.3), transparent 70%),
    radial-gradient(ellipse 70px 10px at 45% 70%, rgba(255,255,255,.25), transparent 70%),
    radial-gradient(ellipse 90px 12px at 85% 80%, rgba(255,255,255,.25), transparent 70%),
    linear-gradient(180deg, #7fd0ea 0%, var(--sea) 45%, var(--sea-deep) 100%);
}
.bagbar {
  position: absolute; top: 12px; left: 12px; z-index: 20;
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 250, 240, 0.94); border-radius: 999px; padding: 6px 12px;
  box-shadow: 0 3px 10px var(--shadow);
}
.bagbar .slot {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 1.3rem;
  background: #e6ddc8; color: #b3a588;
}
.bagbar .slot.got { background: var(--sun); color: var(--ink); animation: pop .4s; }

@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.wiggle { animation: wiggle .45s; }
.shake { animation: shake .35s; }

/* 시작 화면 */
.intro {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  background:
    radial-gradient(circle at 85% 15%, var(--sun) 0 50px, transparent 52px),
    linear-gradient(180deg, #bfe9f6 0%, #8fd3ea 45%, var(--sea) 46%, var(--sea-deep) 100%);
}
.card {
  background: var(--paper); border: 4px solid var(--sand-deep); border-radius: var(--radius);
  padding: 22px 24px; box-shadow: 0 8px 24px var(--shadow); text-align: center;
  max-width: 560px; width: 100%;
}
.card h2 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; color: var(--sea-deep); }
.card p { margin: 6px 0; line-height: 1.6; }
.mascot { font-size: 4.2rem; line-height: 1; animation: bob 2.4s ease-in-out infinite; display: inline-block; }
.ages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.age {
  border: 3px solid var(--sand-deep); border-radius: 20px; background: #fff; padding: 12px 6px;
  font-family: var(--font-display); font-size: 1.15rem; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.age b { font-size: 2rem; font-weight: 400; }
.age span { font-family: var(--font-body); font-size: .85rem; color: var(--ink-soft); }
.age[aria-pressed="true"] { background: var(--sun); border-color: var(--coral); }
.big-btn {
  margin-top: 16px; font-family: var(--font-display); font-size: 1.5rem;
  background: var(--coral); color: #fff; border: none; border-radius: 999px; padding: 12px 34px;
  box-shadow: 0 5px 0 #c4533a;
}
.big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c4533a; }
.big-btn.secondary { background: var(--sea); box-shadow: 0 5px 0 var(--sea-deep); }

/* 지도 */
.map .island {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border: none; background: none; padding: 0; width: clamp(96px, 16%, 170px);
}
.island .land {
  width: 100%; aspect-ratio: 1.5; max-width: 100%;
  border-radius: 50% 50% 45% 45%;
  background: radial-gradient(ellipse at 50% 35%, #8fd18a 0 38%, var(--sand) 40% 70%, #e2c27f 72%);
  box-shadow: 0 0 0 6px rgba(255,255,255,.35), 0 8px 0 rgba(0,0,0,.12);
  display: grid; place-items: center; font-size: clamp(2rem, 4.5vw, 3rem);
}
.island .name {
  font-family: var(--font-display); font-size: clamp(.9rem, 1.8vw, 1.15rem);
  background: var(--paper); border-radius: 999px; padding: 4px 12px; white-space: nowrap;
  box-shadow: 0 3px 0 var(--sand-deep);
}
.island.locked .land { filter: grayscale(.85) brightness(.9); }
.island.locked .name::before { content: "🔒 "; }
.island.done .name::after { content: " ⭐"; }
.island:not(.locked):hover .land { transform: scale(1.05); }
.island .land { transition: transform .2s; }
.map .boat { position: absolute; font-size: 2.6rem; transform: translate(-150%, -120%); animation: bob 2s ease-in-out infinite; pointer-events: none; z-index: 5; }
.map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; }

/* 1. 조개 해변 */
.beach .sky { position: absolute; inset: 0 0 auto; height: 30%; background: linear-gradient(180deg, #7fd0ea, var(--sea)); }
.beach .shore {
  position: absolute; inset: 26% 0 0;
  background:
    radial-gradient(circle at 15% 40%, rgba(201,154,78,.25) 0 3px, transparent 4px) 0 0/36px 30px,
    linear-gradient(180deg, #fff3cf 0%, var(--sand) 25%, #eccf8c 100%);
  border-radius: 50% 50% 0 0 / 30px 30px 0 0;
}
.beach .thing {
  position: absolute; transform: translate(-50%, -50%);
  border: none; background: none; padding: 4px; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1;
}
.beach .shell { position: absolute; }
.beach .shell .mound {
  position: absolute; left: -8%; right: -8%; bottom: -6px; height: 55%;
  background: radial-gradient(ellipse at 50% 100%, #e7c578 0 55%, #f0d690 70%, transparent 72%);
  border-radius: 50% 50% 0 0;
}
.beach .fruit-size { font-size: clamp(1.7rem, 3.6vw, 2.5rem); }
.beach .found {
  width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--paper); display: grid; place-items: center;
  font-family: var(--font-display); color: var(--sea-deep); box-shadow: 0 0 0 5px var(--sun); animation: pop .45s;
}

/* 2. 낚시 */
.fishing .lane { position: absolute; left: 0; right: 0; }
.fish {
  position: absolute; top: 50%; left: var(--x, 10%);
  width: clamp(96px, 13vw, 130px); height: clamp(54px, 7vw, 70px); margin-top: calc(clamp(54px, 7vw, 70px) / -2);
  border: none; padding: 0; background: none;
  animation: swim var(--d, 9s) ease-in-out infinite alternate; animation-delay: var(--delay, 0s);
}
.fish .body {
  position: absolute; inset: 0 22% 0 0; border-radius: 50%;
  background: var(--fc, #ffb347); display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(1.7rem, 3.4vw, 2.3rem); color: var(--ink);
  box-shadow: inset -6px -6px 0 rgba(0,0,0,.08);
}
.fish .body::before { content: ""; position: absolute; left: 14%; top: 30%; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
.fish .tail {
  position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  width: 0; height: 0; border-top: 22px solid transparent; border-bottom: 22px solid transparent; border-right: 30px solid var(--fc, #ffb347);
}
.fish.caught { animation: caught .8s forwards; }
@keyframes swim { from { left: 2%; } to { left: calc(98% - clamp(96px, 13vw, 130px)); } }
@keyframes caught { to { transform: translateY(-420px) rotate(-30deg); opacity: 0; } }
.prompt {
  position: absolute; top: 12px; right: 12px; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  background: var(--paper); border-radius: 20px; padding: 8px 14px; box-shadow: 0 4px 12px var(--shadow);
  font-family: var(--font-display); font-size: 1.15rem;
}
.prompt .target { font-size: 2.2rem; color: var(--coral); min-width: 1.2em; text-align: center; }
.speak-btn { border: 3px solid var(--sea); background: #fff; border-radius: 999px; padding: 4px 12px; font-family: var(--font-display); font-size: 1.05rem; }
.seaweed { position: absolute; bottom: 0; font-size: 2.4rem; opacity: .9; pointer-events: none; }

/* 3. 카드 */
.cards-wrap { position: absolute; inset: 64px 12px 12px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: clamp(6px, 1.4vw, 14px); }
.mcard { position: relative; border: none; background: none; padding: 0; perspective: 800px; min-height: 0; }
.mcard .inner { position: absolute; inset: 0; transition: transform .45s; transform-style: preserve-3d; }
.mcard.up .inner, .mcard.matched .inner { transform: rotateY(180deg); }
.mcard .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 16px; display: grid; place-items: center; border: 4px solid #fff;
}
.mcard .back { background: repeating-linear-gradient(45deg, #ff9f80 0 12px, var(--coral) 12px 24px); font-size: 2rem; }
.mcard .front {
  transform: rotateY(180deg); background: var(--paper);
  font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.2rem); color: var(--sea-deep);
}
.mcard .front small { display: block; font-size: .42em; color: var(--ink-soft); text-align: center; }
.mcard.matched .front { background: var(--sun); }

/* 4. 풍선 */
.windy { background: linear-gradient(180deg, #a8def0 0%, #d9f1f8 70%, #9ed69a 70%, #7cc27a 100%); }
.balloon {
  position: absolute; bottom: -170px; left: var(--x);
  border: none; background: none; padding: 0; width: clamp(80px, 11vw, 110px);
  animation: rise var(--d, 9s) linear infinite; animation-delay: var(--delay, 0s);
}
.balloon .ball {
  aspect-ratio: .85; border-radius: 50% 50% 48% 48%; background: var(--bc, #ff7a59);
  display: grid; place-items: center; font-family: var(--font-display); font-size: clamp(2rem, 4vw, 2.7rem); color: #fff;
  text-shadow: 0 2px 0 rgba(0,0,0,.2); box-shadow: inset -10px -10px 0 rgba(0,0,0,.1);
}
.balloon .string { width: 2px; height: 50px; background: var(--ink-soft); margin: 0 auto; }
.balloon.popped { animation: none; }
.balloon.popped .ball { animation: burst .3s forwards; }
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(calc(-1 * var(--h, 600px) - 220px)); } }
@keyframes burst { to { transform: scale(1.8); opacity: 0; } }

/* 5. 낱말 항구 */
.harbor { padding: 70px 16px 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-content: center; }
.house {
  border: 4px solid var(--sand-deep); border-radius: var(--radius); background: var(--paper);
  padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  box-shadow: 0 6px 0 var(--sand-deep);
}
.house .ico { font-size: 3.2rem; }
.house b { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; color: var(--sea-deep); }
.house span { font-size: .92rem; color: var(--ink-soft); line-height: 1.45; }
.house:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sand-deep); }

.panel { background: var(--paper); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: inherit; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 3px solid var(--sea); background: #fff; border-radius: 999px; padding: 6px 14px; font-family: var(--font-display); font-size: 1rem; }
.tab[aria-selected="true"] { background: var(--sea); color: #fff; }
.word-pic { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.word-pic .emoji { font-size: clamp(4rem, 10vw, 6rem); line-height: 1; }
.slots { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.syl {
  width: clamp(76px, 12vw, 104px); aspect-ratio: 1; border-radius: 18px; border: 4px dashed var(--sand-deep);
  background: #fff; position: relative; display: grid; place-items: center;
  font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 3.6rem);
}
.syl .ghost { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(31,52,72,.13); }
.syl .now { position: relative; color: var(--sea-deep); }
.syl.full { border-style: solid; background: var(--sun); border-color: var(--coral); }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  width: clamp(54px, 8vw, 70px); aspect-ratio: 1; border-radius: 16px; border: 3px solid var(--sea);
  background: #fff; font-family: var(--font-display); font-size: clamp(1.8rem, 3.6vw, 2.4rem); color: var(--ink);
  box-shadow: 0 4px 0 var(--sea);
}
.tile.vowel { border-color: var(--kelp); box-shadow: 0 4px 0 var(--kelp); }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sea); }
.tile.glow { background: var(--sun); animation: bob 1s ease-in-out infinite; }
.tile.small { width: clamp(44px, 7vw, 58px); font-size: clamp(1.4rem, 3vw, 1.9rem); }
.typed {
  min-height: 92px; border-radius: 18px; background: #fff; border: 4px solid var(--sand-deep);
  font-family: var(--font-display); font-size: clamp(2.2rem, 6vw, 3.4rem); display: flex; align-items: center; justify-content: center;
  padding: 8px 14px; word-break: keep-all; overflow-wrap: anywhere; text-align: center;
}
.typed .caret { width: 4px; height: 1em; background: var(--coral); margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

.riddle-box { display: flex; gap: 14px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.riddle-box .doctor { font-size: 4rem; line-height: 1; }
.bubble {
  background: #fff; border: 4px solid var(--sea); border-radius: 22px; padding: 14px 18px; max-width: 560px; min-width: 0; flex: 1 1 260px;
  font-family: var(--font-display); font-size: clamp(1.3rem, 3vw, 1.7rem); line-height: 1.5;
}
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.choice {
  border: 4px solid var(--sand-deep); background: #fff; border-radius: 22px; padding: 12px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-family: var(--font-display); font-size: 1.6rem; box-shadow: 0 5px 0 var(--sand-deep);
}
.choice .e { font-size: 3rem; line-height: 1; }
.choice.right { background: var(--sun); border-color: var(--coral); }
.choice.no { opacity: .45; }
.stars { font-size: 1.5rem; letter-spacing: 2px; text-align: center; }

.letter-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px; }
.paper { position: relative; border: 4px solid var(--sand-deep); border-radius: 18px; background: #fff; overflow: hidden; touch-action: none; }
.paper canvas { display: block; width: 100%; aspect-ratio: 4 / 3; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px var(--sand-deep); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--coral); }
.field { display: flex; flex-direction: column; gap: 6px; font-family: var(--font-display); font-size: 1.05rem; }
.field input, .field textarea, .field select {
  font: inherit; font-family: var(--font-body); font-size: 1.05rem; padding: 10px 12px; border-radius: 14px;
  border: 3px solid var(--sand-deep); background: #fff; color: var(--ink); user-select: text; -webkit-user-select: text;
}
.field textarea { min-height: 110px; resize: vertical; }
.note { font-size: .9rem; color: var(--ink-soft); line-height: 1.5; margin: 0; }
.mail-addr { user-select: text; -webkit-user-select: text; font-family: monospace; background: #fff; padding: 2px 6px; border-radius: 6px; }

/* 모달 */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(20, 50, 70, .45); display: grid; place-items: center; padding: 16px; }
.modal {
  background: var(--paper); border: 4px solid var(--sand-deep); border-radius: var(--radius);
  padding: 20px; width: min(620px, 100%); max-height: 90vh; overflow: auto; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.25);
}
.modal h2 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; color: var(--sea-deep); }
.modal p, .modal li { line-height: 1.65; }
.modal ul { text-align: left; padding-left: 1.2em; }
.bag-group { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 14px; }
.bag-item {
  border: 3px solid var(--sand-deep); background: #fff; border-radius: 999px; padding: 4px 12px;
  font-family: var(--font-display); font-size: 1.2rem; display: inline-flex; gap: 6px; align-items: center;
}
.bag-item.empty { opacity: .4; }
.bag-item small { font-size: .8rem; color: var(--ink-soft); }
.reward-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 12px 0; }
.reward-list button {
  border: 3px solid var(--sand-deep); border-radius: 18px; background: #fff; padding: 10px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.reward-list .j { font-family: var(--font-display); font-size: 2.2rem; color: var(--sea-deep); }
.reward-list .w { font-size: .95rem; }
.settings { text-align: left; display: flex; flex-direction: column; gap: 14px; }
.settings .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toggle-line { display: flex; gap: 10px; align-items: center; font-size: 1.05rem; }
.toggle-line input { width: 24px; height: 24px; }
.danger { border: 3px solid #c4533a; color: #c4533a; background: #fff; border-radius: 999px; padding: 6px 14px; font-family: var(--font-display); }

.burst { position: fixed; pointer-events: none; font-size: 2rem; z-index: 200; animation: fly 1.1s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--tx), var(--ty)) rotate(200deg); opacity: 0; } }

#print-area { display: none; }

@media (max-width: 720px) {
  .top .pill .lbl { display: none; }
  .harbor { grid-template-columns: 1fr; padding-top: 64px; }
  .letter-grid { grid-template-columns: 1fr; }
  .stage { height: clamp(460px, 70vh, 620px); }
  .map .island { width: clamp(84px, 24%, 130px); }
  .island .name { font-size: .8rem; padding: 3px 8px; }
  .prompt { top: auto; bottom: 12px; right: 50%; transform: translateX(50%); }
  .cards-wrap { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .fish { animation: none !important; left: var(--x); }
  .balloon { animation: none !important; bottom: var(--y, 30%); }
}
@media print {
  body { background: #fff; padding: 0; }
  #app, .overlay { display: none !important; }
  #print-area { display: block; text-align: center; font-family: var(--font-body); }
  #print-area img { width: 90%; border: 2px solid #999; border-radius: 12px; }
  #print-area h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; }
  #print-area p { font-size: 20px; white-space: pre-wrap; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="pill" id="bagBtn" aria-label="내 가방 보기">🎒 <span class="lbl">내 가방</span></button>
    <h1>몽실이의 한글 바다<small>해달 몽실이와 섬을 돌며 글자 보물을 모아요</small></h1>
    <button class="pill" id="teacherBtn" aria-label="선생님 설정">🧑‍🏫 <span class="lbl">선생님</span></button>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <footer class="bottom">
    <p class="hint" id="hint"></p>
    <div class="nav" id="nav"></div>
  </footer>
</div>
<div id="print-area"></div>

<script>
(() => {
  'use strict';

  /* ---------- 한글 자료 ---------- */
  const JAMO = {
    'ㄱ': { name: '기역', e: '🚂', w: '기차' }, 'ㄴ': { name: '니은', e: '🦋', w: '나비' },
    'ㄷ': { name: '디귿', e: '🌰', w: '도토리' }, 'ㄹ': { name: '리을', e: '🍋', w: '레몬' },
    'ㅁ': { name: '미음', e: '🧢', w: '모자' }, 'ㅂ': { name: '비읍', e: '🍌', w: '바나나' },
    'ㅅ': { name: '시옷', e: '🦁', w: '사자' }, 'ㅇ': { name: '이응', e: '🦆', w: '오리' },
    'ㅈ': { name: '지읒', e: '🚗', w: '자동차' }, 'ㅊ': { name: '치읓', e: '🍫', w: '초콜릿' },
    'ㅋ': { name: '키읔', e: '🐘', w: '코끼리' }, 'ㅌ': { name: '티읕', e: '🐰', w: '토끼' },
    'ㅍ': { name: '피읖', e: '🍇', w: '포도' }, 'ㅎ': { name: '히읗', e: '🦛', w: '하마' },
    'ㅏ': { name: '아', e: '👶', w: '아기' }, 'ㅑ': { name: '야', e: '⚾', w: '야구' },
    'ㅓ': { name: '어', e: '👩', w: '엄마' }, 'ㅕ': { name: '여', e: '🦊', w: '여우' },
    'ㅗ': { name: '오', e: '🦆', w: '오리' }, 'ㅛ': { name: '요', e: '🪀', w: '요요' },
    'ㅜ': { name: '우', e: '🥛', w: '우유' }, 'ㅠ': { name: '유', e: '🦄', w: '유니콘' },
    'ㅡ': { name: '으', e: '🎨', w: '그림' }, 'ㅣ': { name: '이', e: '🦷', w: '이' }
  };
  const CONS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const VOWS = ['ㅏ','ㅑ','ㅓ','ㅕ','ㅗ','ㅛ','ㅜ','ㅠ','ㅡ','ㅣ'];
  const ALL = CONS.concat(VOWS);
  const isVowel = j => VOWS.includes(j);

  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
  const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
  const JONG = [''].concat('ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ'.split(''));
  function compose(c, v, f) {
    const ci = CHO.indexOf(c), vi = JUNG.indexOf(v), fi = JONG.indexOf(f || '');
    if (ci < 0 || vi < 0 || fi < 0) return (c || '') + (v || '') + (f || '');
    return String.fromCharCode(0xAC00 + (ci * 21 + vi) * 28 + fi);
  }
  function decompose(ch) {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code < 0 || code > 11171) return null;
    return [CHO[Math.floor(code / 588)], JUNG[Math.floor((code % 588) / 28)], JONG[code % 28]];
  }

  const ISLANDS = [
    { id: 1, name: '조개 해변', icon: '🐚', game: 'beach', jamo: ['ㄱ','ㄴ','ㄷ','ㅏ','ㅓ','ㅗ'],
      hint: '모래 속에 숨은 조개를 톡! 눌러서 글자를 찾아요.',
      how: ['모래밭 여기저기에 조개 🐚가 숨어 있어요.', '조개를 누르면 글자가 나와요. 몽실이가 글자 이름을 읽어 줘요.', '조개 여섯 개를 모두 찾으면 성공!'] },
    { id: 2, name: '물고기 낚시터', icon: '🎣', game: 'fish', jamo: ['ㄹ','ㅁ','ㅂ','ㅜ','ㅡ','ㅣ'],
      hint: '오른쪽 위 글자와 같은 글자를 가진 물고기를 낚아요.',
      how: ['몽실이가 찾을 글자를 말해 줘요. 🔊 버튼을 누르면 다시 들을 수 있어요.', '헤엄치는 물고기 중에서 같은 글자 물고기를 톡! 눌러요.', '다른 물고기를 누르면 그 글자 이름을 알려 줘요.'] },
    { id: 3, name: '문어 카드 섬', icon: '🐙', game: 'cards', jamo: ['ㅅ','ㅇ','ㅈ','ㅑ','ㅕ','ㅛ'],
      hint: '카드 두 장을 뒤집어 짝꿍 글자를 찾아요.',
      how: ['카드를 한 장씩 두 번 뒤집어요.', '같은 짝꿍이면 카드가 노랗게 남아요.', '5살 친구는 글자 카드와 그림 카드를 짝지어요.'] },
    { id: 4, name: '바람 언덕', icon: '🎈', game: 'balloon', jamo: ['ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㅠ'],
      hint: '소리를 잘 듣고 그 글자 풍선을 터뜨려요.',
      how: ['몽실이가 글자 이름을 말해 줘요.', '하늘로 올라가는 풍선 중에서 그 글자 풍선을 톡!', '5살 친구는 글자를 보지 않고 소리만 듣고 찾아요.'] }
  ];
  const HARBOR = { id: 5, name: '낱말 항구', icon: '⚓' };

  const WORDS = {
    sprout: [['나무','🌳'],['오리','🦆'],['모자','🧢'],['사자','🦁'],['하마','🦛'],['기차','🚂'],['우유','🥛'],['포도','🍇'],['나비','🦋'],['여우','🦊'],['바지','👖'],['거미','🕷️']],
    leaf:   [['곰','🐻'],['별','⭐'],['달','🌙'],['공','⚽'],['문','🚪'],['귤','🍊'],['수박','🍉'],['우산','☂️'],['사탕','🍬'],['양말','🧦'],['기린','🦒'],['연필','✏️']],
    fruit:  [['바나나','🍌'],['토마토','🍅'],['고구마','🍠'],['자동차','🚗'],['도토리','🌰'],['고양이','🐱'],['오징어','🦑'],['거북이','🐢'],['호랑이','🐯'],['수박','🍉'],['우산','☂️'],['연필','✏️']]
  };

  const RIDDLES = [
    { q: '귀가 길쭉하고 깡충깡충 뛰어요. 당근을 좋아해요.', a: '토끼', e: '🐰' },
    { q: '코가 아주 길어서 코로 물을 뿌려요.', a: '코끼리', e: '🐘' },
    { q: '노랗고 길쭉해요. 껍질을 벗겨서 먹어요.', a: '바나나', e: '🍌' },
    { q: '밤하늘에서 반짝반짝 빛나요.', a: '별', e: '⭐' },
    { q: '비가 오는 날 펴서 머리 위에 써요.', a: '우산', e: '☂️' },
    { q: '꽥꽥 소리를 내고 연못에서 헤엄쳐요.', a: '오리', e: '🦆' },
    { q: '칙칙폭폭 기찻길을 따라 달려요.', a: '기차', e: '🚂' },
    { q: '목이 아주 길어서 높은 나뭇잎도 먹어요.', a: '기린', e: '🦒' },
    { q: '겨울잠을 자고 꿀을 좋아해요.', a: '곰', e: '🐻' },
    { q: '겉은 초록 줄무늬, 속은 빨간 여름 과일이에요.', a: '수박', e: '🍉' },
    { q: '다리가 여덟 개예요. 줄을 쳐서 집을 지어요.', a: '거미', e: '🕷️' },
    { q: '등에 딱딱한 집을 지고 느릿느릿 걸어요.', a: '거북이', e: '🐢' },
    { q: '발로 뻥 차면 데굴데굴 굴러가요.', a: '공', e: '⚽' },
    { q: '야옹야옹 울고 수염이 있어요.', a: '고양이', e: '🐱' }
  ];

  const LEVELS = {
    sprout: { label: '새싹', age: '3살', e: '🌱' },
    leaf:   { label: '잎새', age: '4살', e: '🌿' },
    fruit:  { label: '열매', age: '5살', e: '🍎' }
  };

  /* ---------- 저장 ---------- */
  const KEY = 'mongsil-hangul-sea-v1';
  const defaults = () => ({ level: 'sprout', cleared: {}, bag: {}, unlockAll: false, email: '', sound: true, started: false });
  let S = defaults();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defaults(), JSON.parse(raw)); } catch (e) { /* 저장소를 못 쓰면 이번 판만 기억해요 */ }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 무시 */ } }

  /* ---------- 소리 ---------- */
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /ko/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!S.sound || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.rate = 0.85; u.pitch = 1.15;
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    } catch (e) { /* 음성이 없는 기기 */ }
  }
  let actx = null;
  function tone(notes, type = 'sine', len = 0.14) {
    if (!S.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      let t = actx.currentTime;
      notes.forEach(f => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.02); t += len * 0.8;
      });
    } catch (e) { /* 소리 장치 없음 */ }
  }
  const sfx = {
    good: () => tone([660, 880], 'triangle'),
    bad: () => tone([300, 240], 'sine', 0.18),
    pop: () => tone([520, 1040], 'square', 0.08),
    win: () => tone([523, 659, 784, 1047], 'triangle', 0.18)
  };

  /* ---------- 도우미 ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const stage = $('#stage'), hintEl = $('#hint'), navEl = $('#nav');
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rand = (a, b) => a + Math.random() * (b - a);
  let timers = [];
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function retrigger(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function jamoSay(j) { return j + ', ' + JAMO[j].name; }
  function collect(j) { S.bag[j] = (S.bag[j] || 0) + 1; save(); }
  function bagCount() { return ALL.filter(j => S.bag[j]).length; }
  function burst(x, y, n = 14) {
    const icons = ['⭐','🫧','🐚','✨','🌟'];
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'burst'; s.textContent = icons[i % icons.length];
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--tx', rand(-160, 160) + 'px'); s.style.setProperty('--ty', rand(-200, 60) + 'px');
      document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
    }
  }
  function burstAt(el) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }
  function isUnlocked(id) {
    if (S.unlockAll || id === 1) return true;
    if (id === 5) return ISLANDS.every(i => S.cleared[i.id]);
    return !!S.cleared[id - 1];
  }

  function setChrome(hint, buttons) {
    hintEl.textContent = hint;
    navEl.innerHTML = '';
    buttons.forEach(([label, fn, aria]) => {
      const b = document.createElement('button'); b.className = 'pill'; b.textContent = label;
      if (aria) b.setAttribute('aria-label', aria);
      b.addEventListener('click', fn); navEl.appendChild(b);
    });
  }
  const soundBtn = () => [S.sound ? '🔊 소리 켬' : '🔇 소리 끔', () => { S.sound = !S.sound; save(); if (!S.sound && 'speechSynthesis' in window) speechSynthesis.cancel(); current && current(); }];
  let current = null; // 현재 화면을 다시 그리는 함수

  function bagbar(targets, got) {
    return `<div class="bagbar" aria-label="이 섬에서 모은 글자">🎒${targets.map(j => `<span class="slot ${got.has(j) ? 'got' : ''}" data-slot="${j}">${got.has(j) ? j : '?'}</span>`).join('')}</div>`;
  }
  function markSlot(j) { const s = stage.querySelector(`[data-slot="${j}"]`); if (s) { s.textContent = j; s.classList.add('got'); } }

  /* ---------- 모달 ---------- */
  function modal(html, onClose) {
    const ov = document.createElement('div'); ov.className = 'overlay';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(ov);
    let closed = false;
    const close = () => { if (closed) return; closed = true; ov.remove(); onClose && onClose(); };
    ov._close = close;
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    const f = ov.querySelector('button'); f && f.focus();
    return { el: ov, close };
  }

  function showBag() {
    const item = j => `<button class="bag-item ${S.bag[j] ? '' : 'empty'}" data-j="${j}">${S.bag[j] ? j : '?'} <small>${S.bag[j] ? '×' + S.bag[j] : ''}</small></button>`;
    const m = modal(`<h2>🎒 몽실이의 보물 가방</h2>
      <p><b>닿소리(자음)</b></p><div class="bag-group">${CONS.map(item).join('')}</div>
      <p><b>홀소리(모음)</b></p><div class="bag-group">${VOWS.map(item).join('')}</div>
      <p>모은 글자 <b>${bagCount()} / 24</b> · 다녀온 섬에 다시 가면 글자를 더 모을 수 있어요.</p>
      <button class="big-btn" data-close>닫기</button>`);
    m.el.querySelectorAll('.bag-item').forEach(b => b.addEventListener('click', () => {
      const j = b.dataset.j; if (!S.bag[j]) { speak('아직 못 찾은 글자예요'); return; }
      speak(`${JAMO[j].name}. ${JAMO[j].w}의 ${JAMO[j].name}`);
    }));
  }

  function showHow(title, lines) {
    modal(`<h2>❓ ${title}</h2><ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul><button class="big-btn" data-close>알겠어요!</button>`);
  }

  function showTeacher() {
    const a = 2 + Math.floor(Math.random() * 6), b = 2 + Math.floor(Math.random() * 6), ans = a + b;
    const opts = shuffle([ans, ans + 1, ans - 1]);
    const m = modal(`<h2>🧑‍🏫 선생님 확인</h2><p>어른만 열 수 있어요. <b>${a} + ${b}</b> 는 얼마일까요?</p>
      <div class="row-btns">${opts.map(o => `<button class="tile" data-n="${o}">${o}</button>`).join('')}</div>
      <p><button class="pill" data-close>닫기</button></p>`);
    m.el.querySelectorAll('[data-n]').forEach(btn => btn.addEventListener('click', () => {
      if (+btn.dataset.n === ans) { m.close(); teacherPanel(); } else retrigger(btn, 'shake');
    }));
  }
  function teacherPanel() {
    const m = modal(`<h2>🧑‍🏫 선생님 설정</h2>
      <div class="settings">
        <div><b>놀이 단계</b><div class="row" style="margin-top:6px">${Object.entries(LEVELS).map(([k, v]) =>
          `<button class="tab" role="tab" aria-selected="${S.level === k}" data-lv="${k}">${v.e} ${v.label} (${v.age})</button>`).join('')}</div></div>
        <label class="toggle-line"><input type="checkbox" id="optUnlock" ${S.unlockAll ? 'checked' : ''}> 모든 섬 열기 (순서 없이 골라 놀기)</label>
        <label class="toggle-line"><input type="checkbox" id="optSound" ${S.sound ? 'checked' : ''}> 소리와 읽어주기 켜기</label>
        <label class="field" for="optEmail">그림 편지를 받을 선생님 이메일
          <input id="optEmail" type="email" placeholder="teacher@example.com" value="${(S.email || '').replace(/"/g, '&quot;')}"></label>
        <div class="row"><button class="danger" id="resetBtn">처음부터 다시 하기</button><span id="resetMsg" class="note"></span></div>
        <p class="note">놀이 기록은 이 기기의 브라우저에만 저장돼요. 다른 기기와는 이어지지 않아요.</p>
      </div>
      <p><button class="big-btn" data-close>저장하고 닫기</button></p>`, () => {
        S.unlockAll = $('#optUnlock', m.el).checked;
        S.sound = $('#optSound', m.el).checked;
        S.email = $('#optEmail', m.el).value.trim();
        save(); current && current();
      });
    m.el.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => {
      S.level = b.dataset.lv; save();
      m.el.querySelectorAll('[data-lv]').forEach(x => x.setAttribute('aria-selected', x === b));
    }));
    let armed = false;
    $('#resetBtn', m.el).addEventListener('click', () => {
      if (!armed) { armed = true; $('#resetMsg', m.el).textContent = '한 번 더 누르면 모은 글자와 기록이 모두 지워져요.'; return; }
      const keep = { email: S.email, level: S.level };
      S = Object.assign(defaults(), keep); save();
      $('#resetMsg', m.el).textContent = '지웠어요. 처음 화면으로 돌아가요.';
      later(() => { m.el.remove(); goIntro(); }, 700);
    });
  }

  function islandReward(island, onDone) {
    sfx.win(); burst(innerWidth / 2, innerHeight / 2, 24);
    const first = !S.cleared[island.id];
    S.cleared[island.id] = true; save();
    const nextOpen = island.id < 4 ? `<b>${ISLANDS[island.id].name}</b>로 가는 길이 열렸어요!` : '<b>낱말 항구</b>가 열렸어요! 모은 글자로 낱말을 만들어 봐요.';
    const m = modal(`<h2>🎉 ${island.name} 보물 완성!</h2>
      <p>가방에 글자 6개를 넣었어요. 글자를 누르면 다시 들을 수 있어요.</p>
      <div class="reward-list">${island.jamo.map(j => `<button data-j="${j}"><span class="j">${j}</span><span class="w">${JAMO[j].e} ${JAMO[j].w}</span></button>`).join('')}</div>
      ${first ? `<p>${nextOpen}</p>` : ''}
      <div class="row-btns"><button class="big-btn" data-close>🗺️ 바다 지도로</button></div>`, onDone);
    m.el.querySelectorAll('[data-j]').forEach(b => b.addEventListener('click', () => {
      const j = b.dataset.j; speak(`${JAMO[j].name}. ${JAMO[j].w}`);
    }));
    speak(`${island.name} 보물을 모두 찾았어요! 정말 잘했어요.`);
  }

  /* ---------- 시작 화면 ---------- */
  function goIntro() {
    clearTimers(); current = goIntro; stage.className = 'stage';
    stage.innerHTML = `<div class="intro"><div class="card">
      <div class="mascot" aria-hidden="true">🦦</div>
      <h2>몽실이의 한글 바다</h2>
      <p>해달 몽실이와 작은 배를 타고 네 개의 섬을 돌아요.<br>섬마다 숨은 글자 보물을 모으고, 마지막 낱말 항구에서 낱말을 만들어요.</p>
      <p><b>몇 살 친구예요?</b></p>
      <div class="ages">${Object.entries(LEVELS).map(([k, v]) =>
        `<button class="age" aria-pressed="${S.level === k}" data-lv="${k}"><b>${v.e}</b>${v.age}<span>${v.label} 단계</span></button>`).join('')}</div>
      <button class="big-btn" id="goBtn">${S.started ? '이어서 놀기' : '바다로 출발!'}</button>
    </div></div>`;
    stage.querySelectorAll('.age').forEach(b => b.addEventListener('click', () => {
      S.level = b.dataset.lv; save();
      stage.querySelectorAll('.age').forEach(x => x.setAttribute('aria-pressed', x === b));
      speak(LEVELS[S.level].age + ' 친구 반가워요');
    }));
    $('#goBtn').addEventListener('click', () => { S.started = true; save(); speak('몽실이와 한글 바다로 출발!'); goMap(); });
    setChrome('나이를 고르고 출발 버튼을 눌러요. 선생님은 오른쪽 위에서 단계를 바꿀 수 있어요.', [soundBtn()]);
  }

  /* ---------- 바다 지도 ---------- */
  const SPOTS = [[16, 66], [33, 30], [52, 68], [70, 30], [85, 66]];
  function goMap() {
    clearTimers(); current = goMap; stage.className = 'stage';
    const all = ISLANDS.concat([HARBOR]);
    let here = 0; all.forEach((it, i) => { if (isUnlocked(it.id)) here = i; });
    const path = SPOTS.map(([x, y]) => `${x},${y}`).join(' ');
    stage.innerHTML = `<div class="scene map"><div class="waves"></div>
      <svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${path}" fill="none" stroke="#fffaf0" stroke-width="0.8" stroke-dasharray="2 2" opacity=".75"/></svg>
      ${all.map((it, i) => {
        const open = isUnlocked(it.id);
        return `<button class="island ${open ? '' : 'locked'} ${S.cleared[it.id] ? 'done' : ''}" style="left:${SPOTS[i][0]}%;top:${SPOTS[i][1]}%" data-id="${it.id}"
          aria-label="${it.name}${open ? '' : ', 아직 잠겨 있어요'}"><span class="land">${it.icon}</span><span class="name">${i < 4 ? (i + 1) + '. ' : ''}${it.name}</span></button>`;
      }).join('')}
      <div class="boat" style="left:${SPOTS[here][0]}%;top:${SPOTS[here][1]}%">🦦</div>
    </div>`;
    stage.querySelectorAll('.island').forEach(b => b.addEventListener('click', () => {
      const id = +b.dataset.id;
      if (!isUnlocked(id)) { retrigger(b, 'shake'); speak(id === 5 ? '네 개의 섬을 모두 다녀오면 열려요' : '앞의 섬을 먼저 다녀와요'); sfx.bad(); return; }
      if (id === 5) goHarbor(); else startIsland(ISLANDS[id - 1]);
    }));
    setChrome(`섬을 차례대로 다녀와요. 모은 글자 ${bagCount()} / 24`, [
      ['🏠 처음 화면', goIntro],
      ['❓ 놀이 방법', () => showHow('바다 지도', ['1번 섬부터 차례대로 열려요.', '섬마다 글자 6개를 모아 가방에 넣어요.', '네 섬을 모두 다녀오면 낱말 항구가 열려요.', '⭐가 붙은 섬은 다시 가서 글자를 더 모을 수 있어요.'])],
      soundBtn()
    ]);
  }

  function startIsland(island) {
    clearTimers();
    current = () => startIsland(island);
    stage.className = 'stage';
    setChrome(island.hint, [
      ['🗺️ 바다 지도', goMap],
      ['❓ 놀이 방법', () => showHow(island.name, island.how)],
      soundBtn()
    ]);
    ({ beach: gameBeach, fish: gameFish, cards: gameCards, balloon: gameBalloon })[island.game](island);
  }

  /* ---------- 1. 조개 해변 ---------- */
  function gameBeach(island) {
    const lv = S.level, got = new Set();
    const decoyN = { sprout: 3, leaf: 5, fruit: 8 }[lv];
    const cells = [];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 6; c++) cells.push([c, r]);
    const pick = shuffle(cells).slice(0, 6 + decoyN);
    const decoys = ['🦀', '🪨', '⭐', '🌿', '🦀', '🪵', '🌿', '🪨'];
    const things = pick.map(([c, r], i) => {
      const x = (c + 0.5) / 6 * 100 + rand(-4, 4), y = 40 + r * 21 + rand(-4, 4);
      if (i < 6) {
        const j = island.jamo[i];
        return `<button class="thing shell ${lv === 'fruit' ? 'fruit-size' : ''}" style="left:${x}%;top:${y}%" data-j="${j}" aria-label="조개"><span class="ico">🐚</span>${lv !== 'sprout' ? '<span class="mound"></span>' : ''}</button>`;
      }
      return `<button class="thing decoy" style="left:${x}%;top:${y}%" aria-label="모래 위 물건">${decoys[i % decoys.length]}</button>`;
    });
    stage.innerHTML = `<div class="scene beach"><div class="sky"></div><div class="shore"></div>${things.join('')}${bagbar(island.jamo, got)}</div>`;
    stage.querySelectorAll('.shell').forEach(b => b.addEventListener('click', () => {
      const j = b.dataset.j; if (got.has(j)) { speak(jamoSay(j)); return; }
      got.add(j); collect(j); markSlot(j); sfx.good(); burstAt(b);
      b.innerHTML = `<span class="found">${j}</span>`; b.setAttribute('aria-label', `${j} ${JAMO[j].name}`);
      speak(`${JAMO[j].name}! ${JAMO[j].w}의 ${JAMO[j].name}`);
      if (got.size === island.jamo.length) later(() => islandReward(island, goMap), 1300);
    }));
    stage.querySelectorAll('.decoy').forEach(b => b.addEventListener('click', () => {
      retrigger(b, 'wiggle'); sfx.bad(); speak(['여기엔 없어요', '조개를 찾아봐요', '다른 곳을 볼까요?'][Math.floor(Math.random() * 3)]);
    }));
    later(() => speak('모래 속에 숨은 조개를 찾아봐요'), 300);
  }

  /* ---------- 2. 물고기 낚시 ---------- */
  function distractors(target, n) {
    return shuffle(ALL.filter(j => j !== target)).slice(0, n);
  }
  const FISH_COLORS = ['#ffb347', '#ff8fab', '#9be37a', '#ffe066', '#b9a3ff', '#7fd6ff'];
  function gameFish(island) {
    const lv = S.level, got = new Set(), order = shuffle(island.jamo);
    const n = { sprout: 3, leaf: 4, fruit: 5 }[lv];
    const speed = { sprout: [10, 14], leaf: [7, 11], fruit: [5, 8] }[lv];
    let round = 0, busy = false;
    function draw() {
      const target = order[round];
      const opts = shuffle([target].concat(distractors(target, n - 1)));
      const laneH = 72 / n;
      stage.innerHTML = `<div class="scene fishing"><div class="waves"></div>
        <span class="seaweed" style="left:4%">🌿</span><span class="seaweed" style="left:46%">🪸</span><span class="seaweed" style="right:5%">🌿</span>
        ${opts.map((j, i) => `<div class="lane" style="top:${22 + i * laneH}%;height:${laneH}%">
          <button class="fish" data-j="${j}" aria-label="${j} 물고기" style="--fc:${FISH_COLORS[i % 6]};--d:${rand(speed[0], speed[1]).toFixed(1)}s;--delay:-${rand(0, 8).toFixed(1)}s;--x:${8 + ((i * 37) % 60)}%">
            <span class="body">${j}</span><span class="tail"></span></button></div>`).join('')}
        ${bagbar(island.jamo, got)}
        <div class="prompt"><span>🎣 찾을 글자</span><span class="target">${lv === 'fruit' ? '?' : target}</span><button class="speak-btn" id="sayT">🔊 듣기</button></div>
      </div>`;
      const say = () => speak(`${JAMO[target].name}을 찾아요`);
      $('#sayT').addEventListener('click', say);
      later(say, 250);
      stage.querySelectorAll('.fish').forEach(b => b.addEventListener('click', () => {
        if (busy) return;
        const j = b.dataset.j;
        if (j === target) {
          busy = true; got.add(j); collect(j); sfx.good(); burstAt(b);
          const r = b.getBoundingClientRect(); b.style.left = (r.left - b.parentElement.getBoundingClientRect().left) + 'px';
          b.classList.add('caught'); markSlot(j);
          const t = stage.querySelector('.prompt .target'); if (t) t.textContent = j;
          speak(`${JAMO[j].name}! 낚았다!`);
          later(() => { round++; busy = false; if (round >= order.length) islandReward(island, goMap); else draw(); }, 1300);
        } else {
          sfx.bad(); retrigger(b, 'shake'); speak(`이건 ${JAMO[j].name}이에요. 다시 찾아볼까요?`);
        }
      }));
    }
    draw();
  }

  /* ---------- 3. 문어 카드 ---------- */
  function gameCards(island) {
    const lv = S.level, got = new Set();
    const deck = shuffle(island.jamo.flatMap(j => [{ j, pic: false }, { j, pic: lv === 'fruit' }]));
    stage.innerHTML = `<div class="scene" style="background:linear-gradient(180deg,#8fd3ea,#3a9cc4)">
      ${bagbar(island.jamo, got)}
      <div class="prompt"><span>🐙 짝꿍 찾기</span></div>
      <div class="cards-wrap">${deck.map((c, i) => `<button class="mcard" data-i="${i}" data-j="${c.j}" aria-label="뒤집힌 카드">
        <span class="inner"><span class="face back">🐙</span>
        <span class="face front">${c.pic ? `<span>${JAMO[c.j].e}<small>${JAMO[c.j].w}</small></span>` : c.j}</span></span></button>`).join('')}</div></div>`;
    const cards = [...stage.querySelectorAll('.mcard')];
    let open = [], lock = false;
    if (lv === 'sprout') {
      lock = true; cards.forEach(c => c.classList.add('up'));
      speak('카드를 잘 기억해요');
      later(() => { cards.forEach(c => c.classList.remove('up')); lock = false; }, 3200);
    } else later(() => speak('카드 두 장을 뒤집어 짝꿍을 찾아요'), 300);
    cards.forEach(c => c.addEventListener('click', () => {
      if (lock || c.classList.contains('up') || c.classList.contains('matched')) return;
      c.classList.add('up'); open.push(c);
      const d = deck[+c.dataset.i];
      speak(d.pic ? JAMO[d.j].w : JAMO[d.j].name);
      if (open.length < 2) return;
      lock = true;
      const [a, b] = open; open = [];
      if (a.dataset.j === b.dataset.j) {
        later(() => {
          a.classList.add('matched'); b.classList.add('matched'); sfx.good(); burstAt(b);
          const j = a.dataset.j; got.add(j); collect(j); markSlot(j); speak(`짝꿍! ${JAMO[j].name}`);
          lock = false;
          if (got.size === island.jamo.length) later(() => islandReward(island, goMap), 1200);
        }, 500);
      } else {
        later(() => { sfx.bad(); a.classList.remove('up'); b.classList.remove('up'); lock = false; }, 1100);
      }
    }));
  }

  /* ---------- 4. 바람 언덕 풍선 ---------- */
  const BALLOON_COLORS = ['#ff7a59', '#4cb5e0', '#9b7bea', '#2f8a5b', '#f2a93b', '#e85d9a'];
  function gameBalloon(island) {
    const lv = S.level, got = new Set(), order = shuffle(island.jamo);
    const n = { sprout: 3, leaf: 4, fruit: 5 }[lv];
    const speed = { sprout: [11, 14], leaf: [8, 11], fruit: [6, 9] }[lv];
    let round = 0, busy = false;
    function draw() {
      const target = order[round];
      const opts = shuffle([target].concat(distractors(target, n - 1)));
      stage.innerHTML = `<div class="scene windy">
        ${opts.map((j, i) => {
          const x = (i + 0.5) / n * 100;
          return `<button class="balloon" data-j="${j}" aria-label="${j} 풍선"
            style="--x:calc(${x}% - clamp(40px, 5.5vw, 55px));--bc:${BALLOON_COLORS[i % 6]};--d:${rand(speed[0], speed[1]).toFixed(1)}s;--delay:-${rand(0, speed[0]).toFixed(1)}s;--y:${20 + (i % 2) * 25}%">
            <span class="ball" style="display:grid">${j}</span><span class="string" style="display:block"></span></button>`;
        }).join('')}
        ${bagbar(island.jamo, got)}
        <div class="prompt"><span>🎈 터뜨릴 글자</span><span class="target">${lv === 'fruit' ? '?' : target}</span><button class="speak-btn" id="sayT">🔊 듣기</button></div>
      </div>`;
      stage.style.setProperty('--h', stage.clientHeight + 'px');
      const say = () => speak(`${JAMO[target].name} 풍선을 터뜨려요`);
      $('#sayT').addEventListener('click', say);
      later(say, 250);
      stage.querySelectorAll('.balloon').forEach(b => b.addEventListener('click', () => {
        if (busy) return;
        const j = b.dataset.j;
        if (j === target) {
          busy = true; got.add(j); collect(j); sfx.pop(); burstAt(b);
          const cs = getComputedStyle(b).transform; b.style.transform = cs === 'none' ? '' : cs;
          b.classList.add('popped'); markSlot(j);
          const t = stage.querySelector('.prompt .target'); if (t) t.textContent = j;
          speak(`펑! ${JAMO[j].name}`);
          later(() => { round++; busy = false; if (round >= order.length) islandReward(island, goMap); else draw(); }, 1200);
        } else {
          sfx.bad(); retrigger(b.querySelector('.ball'), 'shake'); speak(`이건 ${JAMO[j].name}이에요`);
        }
      }));
    }
    draw();
  }

  /* ---------- 5. 낱말 항구 ---------- */
  function goHarbor() {
    clearTimers(); current = goHarbor; stage.className = 'stage';
    stage.innerHTML = `<div class="scene" style="background:linear-gradient(180deg,#bfe9f6 0%,#8fd3ea 40%,var(--sand) 40%,#eccf8c 100%)">
      <div class="prompt" style="left:12px;right:auto"><span>⚓ 낱말 항구 · 모은 글자 ${bagCount()} / 24</span></div>
      <div class="harbor scene">
        <button class="house" id="hWord"><span class="ico">🛠️</span><b>낱말 공방</b><span>그림을 보고 글자 조각을 맞춰<br>낱말을 만들어요</span></button>
        <button class="house" id="hRiddle"><span class="ico">🐙</span><b>문어 박사 수수께끼</b><span>수수께끼를 듣고<br>정답 낱말을 찾아요 (10문제)</span></button>
        <button class="house" id="hLetter"><span class="ico">📮</span><b>그림 편지</b><span>마음대로 그리고 쓰고<br>인쇄하거나 선생님께 보내요</span></button>
      </div></div>`;
    $('#hWord').addEventListener('click', () => goWorkshop('build'));
    $('#hRiddle').addEventListener('click', goRiddle);
    $('#hLetter').addEventListener('click', goLetter);
    setChrome('모은 글자로 낱말 놀이를 해요. 하고 싶은 집을 골라요.', [['🗺️ 바다 지도', goMap], soundBtn()]);
    later(() => speak('낱말 항구에 도착했어요'), 200);
  }

  /* 낱말 공방 */
  function goWorkshop(mode) {
    clearTimers(); current = () => goWorkshop(mode);
    stage.className = 'stage tall';
    stage.innerHTML = `<div class="panel">
      <div class="panel-head"><b style="font-family:var(--font-display);font-size:1.4rem;color:var(--sea-deep)">🛠️ 낱말 공방</b>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="${mode === 'build'}" data-m="build">그림 보고 만들기</button>
          <button class="tab" role="tab" aria-selected="${mode === 'free'}" data-m="free">내 마음대로 만들기</button>
        </div></div><div id="wsBody" style="display:flex;flex-direction:column;gap:14px"></div></div>`;
    stage.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => goWorkshop(b.dataset.m)));
    setChrome(mode === 'build' ? '그림 이름에 들어가는 글자를 차례대로 눌러요.' : '글자를 눌러 내 이름이나 좋아하는 낱말을 만들어요.', [
      ['⚓ 낱말 항구', goHarbor],
      ['❓ 놀이 방법', () => showHow('낱말 공방', ['<b>그림 보고 만들기</b>: 그림 이름을 듣고 글자 조각을 차례대로 눌러요. 첫소리 → 가운뎃소리 → 받침 순서예요.', '틀리면 몽실이가 반짝이는 조각으로 도와줘요.', '<b>내 마음대로 만들기</b>: 닿소리와 홀소리를 눌러 글자를 모아요. 🔊를 누르면 읽어 줘요.'])],
      soundBtn()
    ]);
    (mode === 'build' ? wordBuild : freeType)($('#wsBody'));
  }

  function wordBuild(box) {
    const lv = S.level;
    const list = shuffle(WORDS[lv].filter(([w]) => [...w].every(ch => { const d = decompose(ch); return d && ALL.includes(d[0]) && ALL.includes(d[1]) && (!d[2] || ALL.includes(d[2])); }))).slice(0, 5);
    let wi = 0, stars = 0;
    function draw() {
      const [word, emo] = list[wi];
      const syls = [...word].map(ch => decompose(ch));
      const seq = []; syls.forEach((d, si) => d.forEach((j, pi) => { if (j) seq.push({ si, pi, j }); }));
      const total = { sprout: 8, leaf: 10, fruit: 12 }[lv];
      const need = [...new Set(seq.map(s => s.j))];
      const tiles = shuffle(need.concat(shuffle(ALL.filter(j => !need.includes(j))).slice(0, Math.max(0, total - need.length))));
      const ghost = lv !== 'fruit';
      let idx = 0, miss = 0, firstTry = true;
      box.innerHTML = `<div class="word-pic"><span class="emoji" aria-hidden="true">${emo}</span>
          <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
            <button class="speak-btn" id="sayW">🔊 이름 듣기</button>
            <span class="note">${wi + 1} / ${list.length} 번째 낱말${stars ? ' · ' + '⭐'.repeat(stars) : ''}</span></div></div>
        <div class="slots">${syls.map((d, i) => `<div class="syl" data-s="${i}">${ghost ? `<span class="ghost">${word[i]}</span>` : ''}<span class="now"></span></div>`).join('')}</div>
        <div class="tiles">${tiles.map(j => `<button class="tile ${isVowel(j) ? 'vowel' : ''}" data-j="${j}" aria-label="${JAMO[j].name}">${j}</button>`).join('')}</div>`;
      const sayW = () => speak(word);
      $('#sayW', box).addEventListener('click', sayW);
      later(sayW, 250);
      const parts = syls.map(() => ['', '', '']);
      function render() {
        parts.forEach((p, i) => {
          const el = box.querySelector(`[data-s="${i}"]`);
          el.querySelector('.now').textContent = p[1] ? compose(p[0], p[1], p[2]) : p[0];
          const done = p[0] === syls[i][0] && p[1] === syls[i][1] && p[2] === syls[i][2];
          el.classList.toggle('full', done);
        });
      }
      box.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
        const step = seq[idx]; if (!step) return;
        const j = t.dataset.j;
        if (j === step.j) {
          parts[step.si][step.pi] = j; idx++; miss = 0; sfx.good(); render();
          box.querySelectorAll('.tile.glow').forEach(g => g.classList.remove('glow'));
          const sylDone = !seq[idx] || seq[idx].si !== step.si;
          if (sylDone) speak(word[step.si]); else speak(JAMO[j].name);
          if (idx >= seq.length) {
            if (firstTry) stars++;
            later(() => { sfx.win(); burstAt(box.querySelector('.slots')); speak(`${word}! 잘 만들었어요`); }, 500);
            later(() => {
              wi++;
              if (wi < list.length) draw();
              else {
                box.innerHTML = `<div class="card" style="margin:0 auto"><div class="mascot">🦦</div><h2>낱말 ${list.length}개 완성!</h2>
                <p class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(list.length - stars)}</p><p>한 번에 맞힌 낱말에 별을 줬어요.</p>
                <div class="row-btns"><button class="big-btn" id="again">또 만들기</button><button class="big-btn secondary" id="toHarbor">항구로</button></div></div>`;
                $('#again', box).addEventListener('click', () => goWorkshop('build'));
                $('#toHarbor', box).addEventListener('click', goHarbor);
              }
            }, 2300);
          }
        } else {
          miss++; firstTry = false; sfx.bad(); retrigger(t, 'shake');
          speak(`이건 ${JAMO[j].name}이에요`);
          const limit = { sprout: 1, leaf: 2, fruit: 3 }[lv];
          if (miss >= limit) { const g = box.querySelector(`.tile[data-j="${step.j}"]`); g && g.classList.add('glow'); }
        }
      }));
      render();
    }
    draw();
  }

  function freeType(box) {
    let units = [];
    const show = u => u === ' ' ? ' ' : (u.cho && u.jung ? compose(u.cho, u.jung, u.jong) : (u.cho || '') + (u.jung || ''));
    const text = () => units.map(show).join('');
    box.innerHTML = `<div class="typed" id="typed" aria-live="polite"></div>
      <div class="row-btns">
        <button class="speak-btn" id="fRead">🔊 읽어 주세요</button>
        <button class="speak-btn" id="fSpace">띄어 쓰기</button>
        <button class="speak-btn" id="fBack">⌫ 하나 지우기</button>
        <button class="speak-btn" id="fClear">처음부터</button>
      </div>
      <div><p class="note" style="text-align:center">닿소리(자음)</p><div class="tiles">${CONS.map(j => `<button class="tile small" data-j="${j}" aria-label="${JAMO[j].name}">${j}</button>`).join('')}</div></div>
      <div><p class="note" style="text-align:center">홀소리(모음)</p><div class="tiles">${VOWS.map(j => `<button class="tile small vowel" data-j="${j}" aria-label="${JAMO[j].name}">${j}</button>`).join('')}</div></div>
      <p class="note" style="text-align:center">예: ㄱ → ㅗ → ㅁ 을 누르면 <b>곰</b>이 돼요. 받침 뒤에 홀소리를 누르면 받침이 다음 글자로 넘어가요.</p>`;
    const out = $('#typed', box);
    const render = () => { out.innerHTML = ''; out.append(document.createTextNode(text())); const c = document.createElement('span'); c.className = 'caret'; out.append(c); };
    box.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
      const j = t.dataset.j, last = units[units.length - 1];
      const unit = last && last !== ' ' ? last : null;
      if (!isVowel(j)) {
        if (unit && unit.cho && unit.jung && !unit.jong) unit.jong = j;
        else units.push({ cho: j, jung: '', jong: '' });
      } else {
        if (unit && unit.cho && !unit.jung) unit.jung = j;
        else if (unit && unit.jong) { const c = unit.jong; unit.jong = ''; units.push({ cho: c, jung: j, jong: '' }); }
        else units.push({ cho: '', jung: j, jong: '' });
      }
      tone([600], 'triangle', 0.06); render();
      const now = units[units.length - 1];
      speak(now.cho && now.jung ? show(now) : JAMO[j].name);
    }));
    $('#fRead', box).addEventListener('click', () => { const t = text().trim(); speak(t || '글자를 먼저 눌러 봐요'); });
    $('#fSpace', box).addEventListener('click', () => { if (units.length && units[units.length - 1] !== ' ') units.push(' '); render(); });
    $('#fBack', box).addEventListener('click', () => {
      const u = units[units.length - 1]; if (!u) return;
      if (u === ' ') units.pop();
      else if (u.jong) u.jong = '';
      else if (u.jung && u.cho) u.jung = '';
      else units.pop();
      render();
    });
    $('#fClear', box).addEventListener('click', () => { units = []; render(); });
    render();
  }

  /* 문어 박사 수수께끼 */
  function goRiddle() {
    clearTimers(); current = goRiddle; stage.className = 'stage tall';
    const lv = S.level, n = { sprout: 3, leaf: 3, fruit: 4 }[lv];
    const qs = shuffle(RIDDLES).slice(0, 10);
    let qi = 0, score = 0;
    setChrome('수수께끼를 잘 듣고 정답을 골라요. 🔊를 누르면 다시 들려줘요.', [['⚓ 낱말 항구', goHarbor], soundBtn()]);
    function draw() {
      const r = qs[qi];
      const opts = shuffle([r].concat(shuffle(RIDDLES.filter(x => x.a !== r.a)).slice(0, n - 1)));
      let first = true;
      stage.innerHTML = `<div class="panel">
        <div class="panel-head"><b style="font-family:var(--font-display);font-size:1.4rem;color:var(--sea-deep)">🐙 문어 박사 수수께끼</b>
          <span class="note">${qi + 1} / 10 문제${score ? ' · ' + '⭐'.repeat(score) : ''}</span></div>
        <div class="riddle-box"><span class="doctor" aria-hidden="true">🐙</span>
          <div class="bubble">${r.q}<br><span style="color:var(--coral)">나는 누구일까요?</span>
          <div style="margin-top:8px"><button class="speak-btn" id="sayQ">🔊 다시 듣기</button></div></div></div>
        <div class="choices">${opts.map(o => `<button class="choice" data-a="${o.a}">${lv === 'fruit' ? '' : `<span class="e">${o.e}</span>`}<span>${o.a}</span></button>`).join('')}</div>
      </div>`;
      const say = () => speak(r.q + ' 나는 누구일까요?');
      $('#sayQ').addEventListener('click', say); later(say, 250);
      stage.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
        if (b.classList.contains('no') || stage.querySelector('.choice.right')) return;
        if (b.dataset.a === r.a) {
          if (first) score++;
          b.classList.add('right'); sfx.win(); burstAt(b);
          if (lv === 'fruit') b.insertAdjacentHTML('afterbegin', `<span class="e">${r.e}</span>`);
          speak(`딩동댕! ${r.a}`);
          later(() => { qi++; if (qi < qs.length) draw(); else end(); }, 1900);
        } else {
          first = false; b.classList.add('no'); sfx.bad(); speak('음, 다시 생각해 볼까요?');
        }
      }));
    }
    function end() {
      stage.innerHTML = `<div class="panel" style="align-items:center;justify-content:center"><div class="card">
        <div class="mascot">🐙</div><h2>수수께끼 박사 인증!</h2>
        <p class="stars">${'⭐'.repeat(score)}${'☆'.repeat(10 - score)}</p>
        <p>10문제 중 <b>${score}문제</b>를 한 번에 맞혔어요.</p>
        <div class="row-btns"><button class="big-btn" id="again">다시 풀기</button><button class="big-btn secondary" id="toHarbor">항구로</button></div></div></div>`;
      speak(`10문제 중 ${score}문제를 한 번에 맞혔어요. 대단해요!`);
      $('#again').addEventListener('click', goRiddle); $('#toHarbor').addEventListener('click', goHarbor);
    }
    draw();
  }

  /* 그림 편지 */
  const INK = ['#1f3448', '#ff7a59', '#f2a93b', '#2f8a5b', '#3a9cc4', '#9b7bea', '#e85d9a'];
  function goLetter() {
    clearTimers(); current = null; stage.className = 'stage tall';
    stage.innerHTML = `<div class="panel">
      <div class="panel-head"><b style="font-family:var(--font-display);font-size:1.4rem;color:var(--sea-deep)">📮 그림 편지</b></div>
      <div class="letter-grid">
        <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
          <div class="paper"><canvas id="cv" width="800" height="600" aria-label="그림 그리는 종이"></canvas></div>
          <div class="palette" role="group" aria-label="색 고르기">
            ${INK.map((c, i) => `<button class="swatch" style="background:${c}" data-c="${c}" aria-label="색 ${i + 1}" aria-pressed="${i === 0}"></button>`).join('')}
            <button class="speak-btn" data-c="eraser">🧽 지우개</button>
            <button class="speak-btn" id="thick">✏️ 굵게</button>
            <button class="speak-btn" id="wipe">🗑️ 새 종이</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
          <label class="field" for="lTo">누구에게 보낼까요?
            <select id="lTo"><option>선생님께</option><option>엄마께</option><option>아빠께</option><option>친구에게</option><option>할머니께</option><option>할아버지께</option></select></label>
          <label class="field" for="lFrom">보내는 친구 이름<input id="lFrom" type="text" maxlength="20" placeholder="예: 김하늘"></label>
          <label class="field" for="lMsg">하고 싶은 말 <span class="note">(어른이 대신 써 줘도 좋아요)</span>
            <textarea id="lMsg" maxlength="400" placeholder="예: 선생님 사랑해요"></textarea></label>
          <div class="row-btns" style="justify-content:flex-start">
            <button class="pill" id="pPrint">🖨️ 인쇄하기</button>
            <button class="pill" id="pSave">💾 그림 저장</button>
            <button class="pill" id="pMail">✉️ 선생님께 보내기</button>
          </div>
          <p class="note" id="mailNote"></p>
        </div>
      </div></div>`;
    setChrome('손가락으로 그림을 그리고, 하고 싶은 말을 적어 편지를 만들어요.', [['⚓ 낱말 항구', goHarbor], soundBtn()]);
    const cv = $('#cv'), ctx = cv.getContext('2d');
    const paperBg = () => { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); };
    paperBg();
    let color = INK[0], width = 8, drawing = false, lastP = null;
    const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    cv.addEventListener('pointerdown', e => { drawing = true; lastP = pos(e); cv.setPointerCapture(e.pointerId); dot(lastP); });
    cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); line(lastP, p); lastP = p; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
    function stroke() { ctx.strokeStyle = ctx.fillStyle = color === 'eraser' ? '#ffffff' : color; ctx.lineWidth = color === 'eraser' ? width * 3 : width; ctx.lineCap = ctx.lineJoin = 'round'; }
    function dot(p) { stroke(); ctx.beginPath(); ctx.arc(p[0], p[1], ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill(); }
    function line(a, b) { stroke(); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    stage.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
      color = b.dataset.c; stage.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', s === b));
    }));
    $('#thick').addEventListener('click', e => { width = width === 8 ? 18 : 8; e.currentTarget.textContent = width === 8 ? '✏️ 굵게' : '✏️ 가늘게'; });
    let wipeArmed = false;
    $('#wipe').addEventListener('click', e => {
      if (!wipeArmed) { wipeArmed = true; e.currentTarget.textContent = '🗑️ 정말 지울까요?'; later(() => { wipeArmed = false; const w = $('#wipe'); if (w) w.textContent = '🗑️ 새 종이'; }, 2500); return; }
      paperBg(); wipeArmed = false; e.currentTarget.textContent = '🗑️ 새 종이';
    });
    const note = $('#mailNote');
    const letterText = () => {
      const to = $('#lTo').value, from = $('#lFrom').value.trim(), msg = $('#lMsg').value.trim();
      return { to, from, msg };
    };
    $('#pPrint').addEventListener('click', () => {
      const { to, from, msg } = letterText();
      const pa = $('#print-area');
      pa.innerHTML = '';
      const h = document.createElement('h2'); h.textContent = `💌 ${to}`;
      const img = document.createElement('img'); img.src = cv.toDataURL('image/png'); img.alt = '그림 편지';
      const p = document.createElement('p'); p.textContent = msg;
      const f = document.createElement('p'); f.textContent = from ? `${from} 올림` : '';
      pa.append(h, img, p, f);
      window.print();
      note.textContent = '인쇄 창이 열리지 않으면, 이 파일을 브라우저에서 직접 열어 주세요. (미리보기 화면에서는 인쇄가 막혀 있을 수 있어요.)';
    });
    $('#pSave').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = cv.toDataURL('image/png'); a.download = `그림편지-${$('#lFrom').value.trim() || '몽실이'}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      note.textContent = '그림 파일 저장을 시작했어요. 저장이 안 되면 브라우저에서 이 파일을 직접 열어 주세요.';
    });
    $('#pMail').addEventListener('click', () => {
      if (!S.email) { note.innerHTML = '선생님 이메일이 아직 없어요. 오른쪽 위 <b>🧑‍🏫 선생님</b>에서 먼저 넣어 주세요.'; return; }
      const { to, from, msg } = letterText();
      const body = `${to}\n\n${msg || '(그림 편지)'}\n\n${from ? from + ' 올림' : ''}\n\n※ 그림은 [그림 저장]으로 저장한 파일을 이 메일에 첨부해 주세요.`;
      const href = `mailto:${encodeURIComponent(S.email)}?subject=${encodeURIComponent('몽실이의 한글 바다 - 그림 편지' + (from ? ' (' + from + ')' : ''))}&body=${encodeURIComponent(body)}`;
      const a = document.createElement('a'); a.href = href; document.body.appendChild(a); a.click(); a.remove();
      note.innerHTML = `메일 프로그램이 열리면 그림 파일을 첨부해 보내 주세요. 열리지 않으면 이 주소로 직접 보내 주세요: <span class="mail-addr"></span>`;
      note.querySelector('.mail-addr').textContent = S.email;
    });
  }

  /* ---------- 시작 ---------- */
  $('#bagBtn').addEventListener('click', showBag);
  $('#teacherBtn').addEventListener('click', showTeacher);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { const o = document.querySelector('.overlay'); o && o._close && o._close(); } });
  goIntro();
})();
</script>
</body>
